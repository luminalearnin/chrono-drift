<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ARROW &amp; BIRDS</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#9bd8ef;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}#shoot{display:none;position:fixed;right:22px;bottom:28px;width:116px;height:58px;border-radius:14px;border:2px solid #fff;background:#ef6b4f;color:white;font-weight:800;font-size:18px;box-shadow:0 5px 0 #b53e37;z-index:3}#shoot:active{transform:translateY(4px);box-shadow:0 1px 0 #b53e37}@media(max-width:800px){#shoot{display:block}}.tip{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);font-size:12px;color:#28536a;white-space:nowrap;pointer-events:none}
</style></head><body><canvas id="c"></canvas><button id="shoot">SHOOT</button><div class="tip">DRAG TO AIM · RELEASE TO SHOOT · HIT +2 · MISS −2</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),shoot=document.querySelector('#shoot');let W,H,dpr,mode='title',score=0,shots=0,hits=0,aim=.0,drag=false,last=0,time=0,birds=[],arrows=[],clouds=[];
function size(){W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!clouds.length)for(let i=0;i<8;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*.35,s:.5+Math.random()*.8})}addEventListener('resize',size);size();
function audio(f=500){try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.035;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function reset(){score=0;shots=0;hits=0;time=0;aim=0;arrows=[];birds=[];for(let i=0;i<6;i++)birds.push({x:W*.63+Math.random()*W*.27,y:H*.2+i%4*H*.12,phase:Math.random()*6.28,alive:true,land:2+Math.random()*4,fly:0,wing:Math.random()*6.28});mode='play'}
function start(){reset();audio(700)}
function pointer(e){let q=e.touches?e.touches[0]:e,r=c.getBoundingClientRect(),px=q.clientX-r.left,py=q.clientY-r.top;let ax=px-W*.16,ay=py-H*.67;aim=Math.atan2(ay,ax);aim=Math.max(-1.05,Math.min(.55,aim))}
function fire(){if(mode==='title'||mode==='over'){start();return}if(mode!=='play'||arrows.some(a=>a.live))return;shots++;let sx=W*.18,sy=H*.67;arrows.push({x:sx,y:sy,vx:Math.cos(aim)*680,vy:Math.sin(aim)*680,live:true,age:0});audio(430)}
c.addEventListener('pointerdown',e=>{if(mode==='title'||mode==='over'){start();return}drag=true;pointer(e)});c.addEventListener('pointermove',e=>{if(drag)pointer(e)});c.addEventListener('pointerup',e=>{if(drag){pointer(e);drag=false;fire()}});shoot.addEventListener('pointerdown',e=>{e.preventDefault();fire()});addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')fire();if(e.key==='ArrowUp')aim-=.08;if(e.key==='ArrowDown')aim+=.08});
function birdHit(a,b){return b.alive&&Math.hypot(a.x-b.x,a.y-b.y)<30}
function update(dt){if(mode!=='play')return;time+=dt;if(time>60){mode='over';return}for(let b of birds){if(!b.alive)continue;b.wing+=dt*10;if(b.fly>0){b.x+=Math.cos(b.phase)*70*dt;b.y+=Math.sin(b.phase)*40*dt;b.fly-=dt;if(b.fly<=0){b.x=W*.64+Math.random()*W*.25;b.y=H*.18+Math.random()*H*.38;b.land=2+Math.random()*5}}else{b.land-=dt;if(b.land<=0){b.fly=1.5+Math.random();b.phase=Math.random()>.5?0:Math.PI}}}for(let a of arrows){if(!a.live)continue;a.age+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=280*dt;for(let b of birds)if(birdHit(a,b)){b.alive=false;a.live=false;score+=2;hits++;audio(900);setTimeout(()=>{b.alive=true;b.x=W*.64+Math.random()*W*.24;b.y=H*.18+Math.random()*H*.4;b.land=2+Math.random()*5},450)}if(a.age>2||a.x>W+50||a.y>H+50){if(a.live){score-=2;audio(170)}a.live=false}}arrows=arrows.filter(a=>a.live)}
function cloud(q){x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(q.x,q.y,28*q.s,0,7);x.arc(q.x+28*q.s,q.y+4,22*q.s,0,7);x.arc(q.x-28*q.s,q.y+6,19*q.s,0,7);x.fill()}
function bird(b){x.save();x.translate(b.x,b.y);let flap=Math.sin(b.wing)*7;x.fillStyle='#263746';x.beginPath();x.ellipse(0,0,18,11,0,0,7);x.fill();x.fillStyle='#4a6874';x.beginPath();x.ellipse(-5,-flap/3,13,5,-.4,0,7);x.fill();x.fillStyle='#f1c34f';x.beginPath();x.moveTo(16,0);x.lineTo(27,4);x.lineTo(16,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-4,3,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(9,-4,1.5,0,7);x.fill();x.restore()}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fd3f0');sky.addColorStop(1,'#e4f2c7');x.fillStyle=sky;x.fillRect(0,0,W,H);clouds.forEach(cloud);x.fillStyle='#72b65b';x.fillRect(0,H*.78,W,H*.22);x.fillStyle='#3e934d';x.beginPath();x.arc(W*.82,H*.82,170,Math.PI,7);x.fill();x.fillStyle='#7b4d31';x.fillRect(W*.76,H*.38,W*.08,H*.48);x.strokeStyle='#7b4d31';x.lineWidth=18;x.beginPath();x.moveTo(W*.80,H*.55);x.lineTo(W*.69,H*.39);x.moveTo(W*.81,H*.58);x.lineTo(W*.91,H*.37);x.stroke();
if(mode==='play'){birds.forEach(b=>{if(b.alive)bird(b)});let sx=W*.18,sy=H*.67;x.strokeStyle='#613b25';x.lineWidth=15;x.beginPath();x.moveTo(sx-28,sy+82);x.lineTo(sx+12,sy-20);x.stroke();x.fillStyle='#dd7d45';x.beginPath();x.arc(sx,sy,31,0,7);x.fill();x.fillStyle='#f4d09a';x.beginPath();x.arc(sx+4,sy-5,19,0,7);x.fill();x.fillStyle='#482e2b';x.beginPath();x.arc(sx+4,sy-5,21,Math.PI,2*Math.PI);x.fill();x.strokeStyle='#9b592e';x.lineWidth=5;x.beginPath();x.arc(sx,sy,42,-1.2,1.2);x.stroke();x.strokeStyle='#d2a05d';x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+Math.cos(aim)*55,sy+Math.sin(aim)*55);x.stroke();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(sx-42*Math.cos(aim),sy-42*Math.sin(aim));x.lineTo(sx+42*Math.cos(aim),sy+42*Math.sin(aim));x.stroke();arrows.forEach(a=>{x.save();x.translate(a.x,a.y);x.rotate(Math.atan2(a.vy,a.vx));x.strokeStyle='#563824';x.lineWidth=4;x.beginPath();x.moveTo(-28,0);x.lineTo(18,0);x.stroke();x.fillStyle='#e8e1c8';x.beginPath();x.moveTo(18,0);x.lineTo(8,-7);x.lineTo(8,7);x.fill();x.restore()});x.fillStyle='rgba(0,0,0,.18)';x.fillRect(16,16,260,104);x.fillStyle='#fff';x.font='800 25px system-ui';x.fillText('ARROW & BIRDS',30,50);x.font='700 21px system-ui';x.fillText('SCORE  '+score,30,82);x.font='15px system-ui';x.fillText('TIME  '+Math.ceil(60-time)+'s   HITS '+hits,30,105)}else{overlay()}requestAnimationFrame(draw)}
function overlay(){x.fillStyle='rgba(21,53,67,.3)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 '+Math.min(64,W/9)+'px system-ui';x.fillText('ARROW & BIRDS',W/2,H*.29);x.font='700 22px system-ui';x.fillText(mode==='title'?'Aim at the birds. Protect the tree.':'TIME UP',W/2,H*.39);x.fillStyle='#ef6b4f';x.fillRect(W/2-130,H*.49,260,66);x.fillStyle='#fff';x.font='900 22px system-ui';x.fillText(mode==='title'?'START GAME':'PLAY AGAIN',W/2,H*.49+42);x.font='16px system-ui';x.fillStyle='#234b5c';x.fillText('Each hit: +2 points     Each miss: −2 points',W/2,H*.67);if(mode==='over'){x.font='800 30px system-ui';x.fillStyle='#173b4b';x.fillText('FINAL SCORE  '+score,W/2,H*.76)}x.textAlign='left'}
requestAnimationFrame(function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)});
</script></body></html>
