const stick=document.querySelector('.stick'),nub=document.querySelector('.nub');function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-61,y=e.clientY-r.top-61,m=Math.hypot(x,y),q=Math.min(1,m/47);if(m){x=x/m*q;y=y/m*q}touch.x=x;touch.y=y;nub.style.transform=`translate(${x*35}px,${y*35}px)`}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e)});stick.addEventListener('pointerup',()=>{touch.x=touch.y=0;nub.style.transform=''});document.querySelector('.drift').addEventListener('pointerdown',()=>touch.drift=true);document.querySelector('.drift').addEventListener('pointerup',()=>touch.drift=false);document.querySelector('.fire').addEventListener('pointerdown',()=>touch.fire=true);document.querySelector('.fire').addEventListener('pointerup',()=>touch.fire=false);

const save=JSON.parse(localStorage.getItem('chronoDrift')||'{}');save.coins??=0;save.mods??=[];save.cosmetics??={bike:'#62f7ff',trail:'#62f7ff',echo:'#ff4fd8'};save.lore??=[];save.daily??={};
const lore=[['FIRST STATIC','The first loop had no beginning.'],['GHOST SIGNAL','An echo is not a memory. It is a promise.'],['VAULT 7','The switch remembers every hand.'],['THREE SECONDS','She learned to steer between heartbeats.'],['ORBITAL RAIN','The city fell upward that night.'],['PARALLAX','Two pilots, one impossible corner.'],['THE WITNESS','The gate only opens for someone left behind.'],['FOURFOLD','Four echoes sang in the same key.'],['ANCHOR','Power is just another word for choosing.'],['LAST LOOP','Some timelines end. This one drifts.']];
const mods=[['Anchor Drift','Tighter slide, slower charge','anchor'],['Phase Plating','One wall clip per Loop','phase'],['Echo Amp','Echo damage +30%, expires 5s early','amp'],['Magnet','Larger shard radius, slower top speed','magnet'],['Glass Cannon','Faster fire, only 2 hits to die','glass'],['Long Haul','+3s starting time, weaker boost','haul']];
let mode='title',paused=false,loop=0,chain=0,t=0,score=0,coins=0,shake=0,flash=0,seed=0,world,player,echoes=[],enemies=[],shots=[],parts=[],shards=[],switches=[],gateOpen=false,record=[],rewind=0,highDaily=save.daily[new Date().toISOString().slice(0,10)]||0;
function newChain(){chain=0;loop=0;seed=(Date.now()^Math.floor(Math.random()*99999))>>>0;score=0;newLoop()}
function newLoop(){t=0;rewind=0;record=[];shots=[];parts=[];shards=[];enemies=[];switches=[];gateOpen=false;const r=seeded(seed+chain*71);world={w:920,h:570,cx:460,cy:285};player={x:140,y:285,vx:0,vy:0,a:0,charge:0,drift:false,hits:0,inv:0,fireCd:0,phase:save.mods.includes('phase')};for(let i=0;i<3;i++)enemies.push({type:['chaser','turret','weaver'][i%3],x:300+r()*500,y:90+r()*390,hp:2,phase:r()*TAU,fire:r()});for(let i=0;i<7;i++)shards.push({x:240+r()*600,y:55+r()*460,got:false,pulse:r()*TAU});for(let i=0;i<2;i++)switches.push({x:300+i*330,y:i?455:115,on:false});for(let i=0;i<2;i++)shards.push({x:650+i*26,y:285+(i?28:-28),got:false,pulse:r()*TAU,vault:true});if(loop>0)echoes=echoes.slice(-4);mode='play';beep(220,.12,'sine',.02)}
function start(){newChain();mode='play';beep(440,.1)}function togglePause(){if(mode==='play'||mode==='pause')mode=mode==='play'?'pause':'play'}
function addPart(x,y,col,n=8){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=rand(20,150);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),col})}}
function fire(x,y,a,owner='player'){shots.push({x,y,a,life:1.4,owner});beep(owner==='player'?620:190,.025,'square',.012)}
function input(){let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(touch.x||touch.y){ax=touch.x;ay=touch.y}return {ax,ay,drift:keys[' ']||touch.drift,fire:keys.x||keys.enter||touch.fire}}
function damage(){if(player.inv>0)return;player.hits++;player.inv=.75;flash=.25;shake=9;beep(90,.1,'sawtooth',.04);if(player.hits>= (save.mods.includes('glass')?2:3)) endLoop(true)}
function endLoop(dead=false){if(mode!=='play')return;mode='rewind';rewind=1.5;beep(dead?70:260,.2,'sawtooth',.03);echoes.push({frames:record.slice(),age:0});if(echoes.length>4)echoes.shift()}
function updateEcho(e,dt){e.age+=dt;let idx=Math.floor((1-e.age/30)*e.frames.length);if(idx<0||!e.frames[idx])return null;let f=e.frames[idx];let q=e.frames[Math.min(idx+1,e.frames.length-1)]||f;return {x:lerp(f.x,q.x,.5),y:lerp(f.y,q.y,.5),a:f.a,fire:f.fire}}
function update(dt){if(mode==='pause')return;if(mode==='rewind'){rewind-=dt;if(rewind<=0){loop++;if(loop>=4){mode='results';coins=Math.floor(score/80)+loop;save.coins+=coins;save.lore[Math.min(9,chain+loop-1)]=true;localStorage.setItem('chronoDrift',JSON.stringify(save));return}newLoop()}return}if(mode!=='play')return;t+=dt;if(t>=30)endLoop(false);let I=input(),p=player;p.inv=Math.max(0,p.inv-dt);p.fireCd-=dt;let drifting=I.drift&&Math.hypot(p.vx,p.vy)>3;p.drift=drifting;let accel=80,top=save.mods.includes('magnet')?19:22,grip=drifting?(save.mods.includes('anchor')?.25:.15):.9;let aim=Math.atan2(I.ay,I.ax);if(Math.hypot(I.ax,I.ay)>.1){let turn=(drifting?5.06:3.49)*dt;let d=((aim-p.a+Math.PI*3)%TAU)-Math.PI;p.a+=clamp(d,-turn,turn)}let fx=Math.cos(p.a),fy=Math.sin(p.a);p.vx+=fx*accel*dt*(Math.hypot(I.ax,I.ay)>.1?1:0);p.vy+=fy*accel*dt*(Math.hypot(I.ax,I.ay)>.1?1:0);let speed=Math.hypot(p.vx,p.vy);p.vx=lerp(p.vx,p.vx-grip*(p.vx-fx*speed)*dt*5,1);p.vy=lerp(p.vy,p.vy-grip*(p.vy-fy*speed)*dt*5,1);if(speed>top){p.vx*=.985;p.vy*=.985}p.x+=p.vx*dt;p.y+=p.vy*dt;let hitWall=p.x<35||p.x>885||p.y<35||p.y>535;if(hitWall){if(p.phase){p.phase=false;p.inv=.8;p.x=clamp(p.x,35,885);p.y=clamp(p.y,35,535)}else{p.x=clamp(p.x,35,885);p.y=clamp(p.y,35,535);if(speed>18)damage();p.vx*=-.3;p.vy*=-.3}}if(drifting)p.charge=clamp(p.charge+dt*(.5+speed/30),0,1);else if(p.charge>.1){let boost=10+p.charge*28;p.vx+=fx*boost;p.vy+=fy*boost;p.inv=.22;p.charge=0;addPart(p.x,p.y,'#c8ff51',15);beep(880,.08,'sine',.02)}if(I.fire&&p.fireCd<=0){p.fireCd=save.mods.includes('glass')?.12:.22;fire(p.x+fx*15,p.y+fy*15,p.a);addPart(p.x,p.y,'#ffc857',4)}let f={x:p.x,y:p.y,a:p.a,fire:I.fire,drift:drifting};record.push(f);if(record.length>900)record.shift();

function worldToScreen(x,y){let z=Math.min(1.12,1+(Math.hypot(player.vx,player.vy)/22)*.08),ox=W/2-world.cx*z,oy=H/2-world.cy*z;return [ox+x*z,oy+y*z,z]}
function drawBike(o,col,ghost=false){let [x,y,z]=worldToScreen(o.x,o.y);ctx.save();ctx.translate(x,y);ctx.rotate(o.a);ctx.globalAlpha=ghost?.38:1;ctx.shadowBlur=20;ctx.shadowColor=col;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=ghost?2:3;ctx.beginPath();ctx.moveTo(18*z,0);ctx.lineTo(-12*z,-8*z);ctx.lineTo(-8*z,0);ctx.lineTo(-12*z,8*z);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,0,5*z,0,TAU);ctx.fill();ctx.restore()}
function draw(){launch.style.display=(W<800&&mode==='title')?'block':'none';ctx.fillStyle='#04050d';ctx.fillRect(0,0,W,H);if(mode==='title'||mode==='shop'||mode==='lore'||mode==='results'){drawBackdrop();if(mode==='title')title();if(mode==='shop')shop();if(mode==='lore')loreScreen();if(mode==='results')results();return}ctx.save();ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.fillStyle='#050817';ctx.fillRect(0,0,W,H);let [lx,ly,z]=worldToScreen(0,0);ctx.strokeStyle='#122c4a';ctx.lineWidth=2;for(let x=0;x<1000;x+=40){let a=worldToScreen(x,0);ctx.beginPath();ctx.moveTo(a[0],worldToScreen(x,0)[1]);ctx.lineTo(a[0],worldToScreen(x,570)[1]);ctx.stroke()}for(let y=0;y<600;y+=40){let a=worldToScreen(0,y);ctx.beginPath();ctx.moveTo(worldToScreen(0,y)[0],a[1]);ctx.lineTo(worldToScreen(920,y)[0],a[1]);ctx.stroke()}let a=worldToScreen(35,35),b=worldToScreen(885,535);ctx.strokeStyle='#62f7ff';ctx.shadowBlur=18;ctx.shadowColor='#62f7ff';ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.shadowBlur=0;for(const s of switches){let q=worldToScreen(s.x,s.y);ctx.fillStyle=s.on?'#c8ff51':'#ff4fd8';ctx.shadowBlur=16;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(q[0]-10,q[1]-10,20,20);ctx.shadowBlur=0}if(!gateOpen){let q=worldToScreen(600,255);ctx.strokeStyle='#ff4fd8';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[0],q[1]+60*z);ctx.stroke()}for(const sh of shards)if(!sh.got){let q=worldToScreen(sh.x,sh.y);ctx.fillStyle='#c8ff51';ctx.shadowBlur=15;ctx.shadowColor='#c8ff51';ctx.beginPath();ctx.arc(q[0],q[1],5+Math.sin(t*4+sh.pulse)*2,0,TAU);ctx.fill();ctx.shadowBlur=0}for(const e of enemies)if(e.hp>0){let q=worldToScreen(e.x,e.y);ctx.fillStyle=e.type==='turret'?'#ffc857':e.type==='weaver'?'#8c7bff':'#ff4fd8';ctx.shadowBlur=16;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(q[0],q[1],e.type==='turret'?12:9,0,TAU);ctx.fill();ctx.shadowBlur=0}for(const e of echoes){let q=updateEcho(e,0);if(q)drawBike(q,save.cosmetics.echo,true)}for(const s of shots){let q=worldToScreen(s.x,s.y);ctx.fillStyle=s.owner==='enemy'?'#ff4fd8':'#ffc857';ctx.fillRect(q[0]-3,q[1]-3,6,6)}for(const pt of parts){let q=worldToScreen(pt.x,pt.y);ctx.globalAlpha=clamp(pt.life*2,0,1);ctx.fillStyle=pt.col;ctx.fillRect(q[0],q[1],3,3);ctx.globalAlpha=1}drawBike(player,save.cosmetics.bike);ctx.restore();hud();if(mode==='pause')pause();if(flash>0){ctx.fillStyle=`rgba(255,60,150,${flash})`;ctx.fillRect(0,0,W,H)}}
function text(s,x,y,size=14,col='#eafcff',align='left'){ctx.fillStyle=col;ctx.font=`${size}px ui-monospace,monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}function panel(x,y,w,h){ctx.fillStyle='#091225eF';ctx.strokeStyle='#23607b';ctx.lineWidth=1;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h)}function drawBackdrop(){ctx.fillStyle='#04050d';ctx.fillRect(0,0,W,H);for(let i=0;i<70;i++){let x=(hash(i*4+2)*W+performance.now()/50*(i%2?1:-1))%W,y=hash(i*9)*H;ctx.fillStyle=i%3?'#62f7ff55':'#ff4fd855';ctx.fillRect(x,y,2,2)}ctx.strokeStyle='#12314b';for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function title(){text('CHRONO',W/2,Math.max(90,H*.22),Math.min(70,W/9),'#62f7ff','center');text('-DRIFT',W/2,Math.max(150,H*.30),Math.min(70,W/9),'#ff4fd8','center');text('NEON LOOP PROTOCOL',W/2,Math.max(185,H*.36),13,'#c8ff51','center');panel(W/2-155,H*.48,310,170);text('4 LOOPS · 30 SECONDS EACH',W/2,H*.48+32,12,'#9ec4d1','center');text('ECHOES REMEMBER. YOU ADAPT.',W/2,H*.48+58,12,'#9ec4d1','center');ctx.fillStyle='#101a32';ctx.strokeStyle='#62f7ff';ctx.strokeRect(W/2-100,H*.48+82,200,42);text('START CHAIN',W/2,H*.48+108,15,'#62f7ff','center');text(`CHRONO ${save.coins}  ·  DAILY BEST ${highDaily}`,W/2,H*.48+150,11,'#ffc857','center');text('[S] SHOP   [L] LORE',W/2,H-45,12,'#73adc2','center');if(keys.s){keys.s=false;mode='shop'}if(keys.l){keys.l=false;mode='lore'}if(keys.enter||keys[' ']){keys.enter=keys[' ']=false;start()}}
function hud(){panel(16,14,330,84);text(`LOOP ${loop+1}/4   CHAIN ${chain+1}`,28,38,13,'#62f7ff');text(`TIME  ${Math.max(0,30-t).toFixed(1)}s`,28,61,18,'#ffc857');text(`HITS ${player.hits}/${save.mods.includes('glass')?2:3}   ECHOES ${echoes.length}`,175,38,12);text(`SCORE ${score}`,175,61,12,'#c8ff51');text('SLINGSHOT',28,86,10,'#ff4fd8');ctx.fillStyle='#ff4fd8';ctx.fillRect(100,79,150*player.charge,5);text(gateOpen?'VAULT OPEN':'SWITCH THE GATE',W-22,32,11,gateOpen?'#c8ff51':'#ff4fd8','right')}
function pause(){panel(W/2-130,H/2-70,260,140);text('PAUSED',W/2,H/2-25,24,'#62f7ff','center');text('PRESS P TO RESUME',W/2,H/2+15,11,'#9ec4d1','center')}
function shop(){panel(W/2-300,50,600,H-100);text('GARAGE // SIDEGRADE LAB',W/2,92,25,'#62f7ff','center');text(`CHRONO ${save.coins}`,W/2,120,13,'#ffc857','center');mods.forEach((m,i)=>{let x=W/2-270+(i%2)*280,y=150+Math.floor(i/2)*82;ctx.strokeStyle=save.mods.includes(m[2])?'#c8ff51':'#23607b';ctx.strokeRect(x,y,250,62);text(`${i+1}. ${m[0]} ${save.mods.includes(m[2])?'[EQUIPPED]':''}`,x+10,y+22,12,save.mods.includes(m[2])?'#c8ff51':'#eafcff');text(m[1],x+10,y+42,9,'#9ec4d1');});text('Each mod costs 40 Chrono · press 1–6 to toggle',W/2,H-122,11,'#9ec4d1','center');text('B = back',W/2,H-92,11,'#62f7ff','center');for(let i=0;i<6;i++)if(keys[String(i+1)]){keys[String(i+1)]=false;let id=mods[i][2];if(save.mods.includes(id))save.mods=save.mods.filter(x=>x!==id);else if(save.coins>=40&&save.mods.length<3){save.coins-=40;save.mods.push(id);beep(800,.1)}localStorage.setItem('chronoDrift',JSON.stringify(save))}if(keys.b){keys.b=false;mode='title'}}
function loreScreen(){panel(W/2-300,38,600,H-76);text('LORE LOG // COLLAPSING TIMELINE',W/2,78,20,'#ff4fd8','center');lore.forEach((l,i)=>{let y=110+i*34;text(`${save.lore[i]?'◆':'◇'} ${String(i+1).padStart(2,'0')}  ${save.lore[i]?l[0]:'SIGNAL UNRESOLVED'}`,W/2-260,y,11,save.lore[i]?'#c8ff51':'#4a6070');if(save.lore[i])text(l[1],W/2-90,y,10,'#9ec4d1')});text('B = back',W/2,H-62,11,'#62f7ff','center');if(keys.b){keys.b=false;mode='title'}}
function results(){drawBackdrop();panel(W/2-250,90,500,400);text('CHAIN COMPLETE',W/2,140,30,'#62f7ff','center');text(`SCORE  ${score}`,W/2,188,22,'#c8ff51','center');text(`CHRONO EARNED  ${coins}`,W/2,220,14,'#ffc857','center');text(`ECHOES RECORDED  ${echoes.length}`,W/2,248,12,'#9ec4d1','center');text('LORE FRAGMENT UNLOCKED',W/2,295,12,'#ff4fd8','center');text(lore[Math.min(9,loop-1)][0],W/2,328,18,'#eafcff','center');text(lore[Math.min(9,loop-1)][1],W/2,355,11,'#9ec4d1','center');text('ENTER = drift again   B = title',W/2,440,11,'#62f7ff','center');if(keys.enter||keys[' ']){keys.enter=keys[' ']=false;newChain()}if(keys.b){keys.b=false;mode='title'}}
let last=performance.now();function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
