<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WILD ARROW TRAILS</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#78c9e2;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}button{font:800 15px system-ui;border:0;border-radius:12px;padding:12px 18px;background:#ef704e;color:#fff;box-shadow:0 4px 0 #b44837;letter-spacing:.03em}button:active{transform:translateY(3px);box-shadow:0 1px 0 #b44837}.hud{position:fixed;left:14px;top:14px;color:#fff;background:#173d48cc;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.55;pointer-events:none;z-index:2}.fire{position:fixed;right:18px;bottom:26px;width:112px;height:58px;display:none;z-index:3}.help{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);color:#235262;font-size:11px;white-space:nowrap;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div id="hud" class="hud" style="display:none"></div><button id="fire" class="fire">SHOOT</button><div class="help">SWIPE FROM THE BOW TO AIM · RELEASE TO FIRE</div><script>
'use strict';const C=document.querySelector('#c'),g=C.getContext('2d'),HUD=document.querySelector('#hud'),FIRE=document.querySelector('#fire');let W,H,S=1,screen='home',level=0,coins=0,aim=0,power=.75,drag=false,shotLock=0,elapsed=0,score=0,got=0,miss=0,arrows=0,targets=[],shots=[],horse=null,particles=[],toast='';let profile=JSON.parse(localStorage.getItem('wildArrowTrails')||'{}');coins=profile.coins||0;let unlocked=profile.unlocked||1,upgrades=profile.upgrades||{quiver:0,steady:0,flame:0};
const LEVELS=[{name:'MEADOW BIRDS',target:'bird',need:6,arrows:10,bg:'meadow',goal:'Perched birds above the old dog trail.'},{name:'RIVER DUCKS',target:'duck',need:7,arrows:11,bg:'river',goal:'Ducks cross the water, then settle if you wait.'},{name:'FOREST CHASE',target:'bird',need:8,arrows:13,bg:'forest',goal:'Birds weave between the trees from your cart.'},{name:'LAKE BOAT',target:'duck',need:9,arrows:14,bg:'lake',goal:'Track the flock from a bright little boat.'},{name:'SUNNY HILLS',target:'deer',need:6,arrows:10,bg:'hill',goal:'Deer run over the green hill.'},{name:'WAGON RUN',target:'deer',need:8,arrows:13,bg:'wagon',goal:'A faster pursuit with a moving wagon.'}];
function resize(){W=innerWidth;H=innerHeight;S=devicePixelRatio||1;C.width=W*S;C.height=H*S;g.setTransform(S,0,0,S,0,0);FIRE.style.display=(W<800&&screen==='play')?'block':'none'}addEventListener('resize',resize);resize();
function save(){profile={coins,unlocked,upgrades};localStorage.setItem('wildArrowTrails',JSON.stringify(profile))}function tone(f=450){try{let a=new AudioContext,o=a.createOscillator(),n=a.createGain();o.frequency.value=f;n.gain.value=.035;n.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.connect(n).connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}
function start(i){level=i;let L=LEVELS[level];screen='play';elapsed=0;got=0;miss=0;score=0;shotLock=0;aim=-.15;power=.78;arrows=L.arrows+upgrades.quiver*2;targets=[];shots=[];horse=null;toast='';for(let j=0;j<L.need+3;j++)spawnTarget(j);resize();tone(620)}
function spawnTarget(i){let L=LEVELS[level],t=L.target,side=i%2?1:-1;targets.push({type:t,x:W*.54+Math.random()*W*.4,y:H*(.25+Math.random()*.38),vx:(t==='deer'?65:32)*side,vy:0,phase:Math.random()*6.28,alive:true,settle:level===1?3+Math.random()*5:0,hit:false,scale:t==='deer'?1.15:1})}
function startAim(e){if(screen==='home'||screen==='levels'||screen==='shop'||screen==='result'){tapMenu(e);return}if(screen!=='play'||shotLock>0)return;drag=true;aimFrom(e)}function aimFrom(e){let q=e.touches?e.touches[0]:e,r=C.getBoundingClientRect(),px=q.clientX-r.left,py=q.clientY-r.top,ax=px-W*.18,ay=py-H*.68;aim=Math.max(-1.16,Math.min(.48,Math.atan2(ay,ax)));power=Math.max(.35,Math.min(1,Math.hypot(ax,ay)/Math.max(160,W*.42)))}function release(e){if(!drag)return;aimFrom(e);drag=false;shoot()}
C.addEventListener('pointerdown',startAim);C.addEventListener('pointermove',e=>{if(drag)aimFrom(e)});C.addEventListener('pointerup',release);FIRE.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});addEventListener('keydown',e=>{if(e.key==='ArrowUp')aim-=.06;if(e.key==='ArrowDown')aim+=.06;if(e.key===' ')shoot();if(e.key==='Escape')screen=screen==='play'?'levels':'home'});
function shoot(){if(screen!=='play'||shotLock>0||arrows<=0)return;arrows--;shotLock=.22;let sx=W*.18,sy=H*.68,v=480+power*380;shots.push({x:sx,y:sy,vx:Math.cos(aim)*v,vy:Math.sin(aim)*v,age:0,live:true});tone(380);if(arrows===0&&got<LEVELS[level].need)setTimeout(()=>{if(screen==='play'&&arrows===0)finish(false)},800)}
function hit(t){t.alive=false;t.hit=true;got++;score+=10;coins+=10;burst(t.x,t.y,t.type==='deer'?'#e8794e':'#ffe17b');tone(820);if(got>=LEVELS[level].need){setTimeout(()=>finish(true),600)}}
function finish(won){if(screen!=='play')return;screen='result';save();if(won&&level+1<LEVELS.length&&unlocked<=level+1){unlocked=level+2;save()}tone(won?900:130)}
function burst(px,py,col){for(let i=0;i<16;i++){let a=Math.random()*6.28,s=40+Math.random()*130;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,col})}}
function update(dt){if(screen!=='play')return;elapsed+=dt;shotLock=Math.max(0,shotLock-dt);let L=LEVELS[level];if(elapsed>75){finish(got>=L.need);return}for(let t of targets){if(!t.alive)continue;t.phase+=dt*3;if(t.settle>0)t.settle-=dt;else{t.x+=t.vx*dt;t.y+=Math.sin(t.phase)*18*dt}if(t.x<W*.45||t.x>W*.96)t.vx*=-1;if(t.type==='deer'){t.y+=Math.sin(t.phase*1.4)*20*dt;t.x+=t.vx*.4*dt} }for(let a of shots){if(!a.live)continue;a.age+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=420*dt;for(let t of targets)if(t.alive&&Math.hypot(a.x-t.x,a.y-t.y)<34*t.scale){a.live=false;hit(t);break}if(a.age>2.4||a.x>W+50||a.y>H+80){if(a.live){a.live=false;miss++;score-=2;tone(170)}}}shots=shots.filter(a=>a.live);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(!horse&&Math.random()<dt*.018)horse={x:-60,y:H*.74,vx:150,life:5};if(horse){horse.x+=horse.vx*dt;horse.life-=dt;if(horse.x>W+80||horse.life<0)horse=null}}
function bg(kind){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,kind==='river'||kind==='lake'?'#8bcaf2':'#9ddcf0');sky.addColorStop(1,kind==='night'?'#27384f':'#e7f1c5');g.fillStyle=sky;g.fillRect(0,0,W,H);if(kind==='river'||kind==='lake'){g.fillStyle='#4aafd2';g.fillRect(0,H*.56,W,H*.44);g.strokeStyle='#b5edf1';g.lineWidth=2;for(let y=H*.62;y<H;y+=28){g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(W*.3,y-10,W*.6,y);g.quadraticCurveTo(W*.82,y+10,W,y);g.stroke()}}else{g.fillStyle=kind==='forest'||kind==='wagon'?'#477e4e':'#70b75d';g.beginPath();g.moveTo(0,H*.7);g.quadraticCurveTo(W*.35,H*.54,W*.65,H*.7);g.quadraticCurveTo(W*.84,H*.55,W,H*.7);g.lineTo(W,H);g.lineTo(0,H);g.fill()}for(let i=0;i<5;i++){let cx=(i*230+70)%W,cy=70+(i%2)*45;g.fillStyle='#ffffff88';g.beginPath();g.arc(cx,cy,28,0,7);g.arc(cx+30,cy+5,22,0,7);g.arc(cx-30,cy+8,20,0,7);g.fill()}if(kind==='meadow'||kind==='forest'){g.fillStyle=kind==='forest'?'#2d673e':'#3d8d46';for(let i=0;i<7;i++){let tx=W*.5+i*W*.08;g.beginPath();g.arc(tx,H*.56,65,3.2,6.2);g.fill();g.fillRect(tx-8,H*.55,16,H*.25)}}if(kind==='river'||kind==='lake'){g.fillStyle='#c9b06f';g.fillRect(W*.05,H*.83,W*.2,10);g.fillStyle='#8d5a3c';g.fillRect(W*.1,H*.77,W*.1,38);g.strokeStyle='#8d5a3c';g.lineWidth=5;g.beginPath();g.moveTo(W*.1,H*.77);g.lineTo(W*.15,H*.67);g.lineTo(W*.21,H*.77);g.stroke()}if(kind==='wagon'){g.fillStyle='#b85f3c';g.fillRect(W*.07,H*.77,W*.23,45);g.fillStyle='#2c4d54';g.beginPath();g.arc(W*.13,H*.84,22,0,7);g.arc(W*.25,H*.84,22,0,7);g.fill()}}
function bow(){let sx=W*.18,sy=H*.68;g.strokeStyle='#744426';g.lineWidth=14;g.beginPath();g.moveTo(sx-30,sy+88);g.lineTo(sx+4,sy-20);g.stroke();g.fillStyle='#e28a53';g.beginPath();g.arc(sx,sy,32,0,7);g.fill();g.fillStyle='#f3d0a1';g.beginPath();g.arc(sx+4,sy-3,20,0,7);g.fill();g.fillStyle='#4a3029';g.beginPath();g.arc(sx+4,sy-5,21,Math.PI,6.2);g.fill();g.strokeStyle='#b97a3b';g.lineWidth=5;g.beginPath();g.arc(sx,sy,44,-1.2,1.2);g.stroke();g.strokeStyle='#f9f4db';g.lineWidth=2;g.beginPath();g.moveTo(sx-42*Math.cos(aim),sy-42*Math.sin(aim));g.lineTo(sx+42*Math.cos(aim),sy+42*Math.sin(aim));g.stroke();}
function drawTarget(t){if(!t.alive)return;g.save();g.translate(t.x,t.y);g.scale(t.scale,t.scale);if(t.type==='deer'){g.fillStyle='#a96b43';g.beginPath();g.ellipse(0,0,28,16,0,0,7);g.arc(24,-13,12,0,7);g.fill();g.strokeStyle='#a96b43';g.lineWidth=5;for(let k of [-15,15]){g.beginPath();g.moveTo(k,10);g.lineTo(k-4,38);g.stroke()}g.strokeStyle='#d7a37a';g.lineWidth=3;g.beginPath();g.moveTo(29,-22);g.lineTo(38,-38);g.moveTo(34,-23);g.lineTo(48,-34);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(28,-16,3,0,7);g.fill()}else{g.fillStyle=t.type==='duck'?'#f3c945':'#354754';g.beginPath();g.ellipse(0,0,20,12,0,0,7);g.fill();g.fillStyle=t.type==='duck'?'#dc744d':'#647b85';g.beginPath();g.ellipse(-8,-8,14,6,-.5,0,7);g.fill();g.fillStyle='#e9784a';g.beginPath();g.moveTo(17,0);g.lineTo(30,5);g.lineTo(17,8);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(10,-5,3,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(11,-5,1.5,0,7);g.fill()}g.restore()}
function horseDraw(){if(!horse)return;g.save();g.translate(horse.x,horse.y);g.fillStyle='#704431';g.beginPath();g.ellipse(0,0,40,20,0,0,7);g.arc(35,-17,16,0,7);g.fill();g.fillStyle='#f7d25c';g.fillRect(8,-42,42,23);g.fillStyle='#312c30';g.beginPath();g.arc(45,-20,3,0,7);g.fill();g.strokeStyle='#704431';g.lineWidth=5;for(let k of [-22,20]){g.beginPath();g.moveTo(k,12);g.lineTo(k-5,40);g.stroke()}g.restore()}
function arrowDraw(a){g.save();g.translate(a.x,a.y);g.rotate(Math.atan2(a.vy,a.vx));g.strokeStyle=upgrades.flame?'#ef684b':'#704326';g.lineWidth=4;g.beginPath();g.moveTo(-28,0);g.lineTo(20,0);g.stroke();g.fillStyle='#eee4c4';g.beginPath();g.moveTo(22,0);g.lineTo(8,-7);g.lineTo(8,7);g.fill();g.restore()}
function text(t,px,py,size,col='#173c45',align='left'){g.fillStyle=col;g.font=`800 ${size}px system-ui`;g.textAlign=align;g.fillText(t,px,py)}function panel(px,py,pw,ph){g.fillStyle='#ffffffe8';g.strokeStyle='#5c938f';g.lineWidth=2;g.beginPath();g.roundRect(px,py,pw,ph,18);g.fill();g.stroke()}
function home(){bg('meadow');g.fillStyle='#173c45cc';g.fillRect(0,0,W,H);text('WILD',W/2,H*.25,Math.min(64,W/7),'#ffe17b','center');text('ARROW TRAILS',W/2,H*.33,Math.min(44,W/10),'#fff','center');text('A gentle cartoon archery adventure',W/2,H*.39,16,'#d5f4e8','center');panel(W/2-150,H*.48,300,190);text('Six scenic hunts',W/2,H*.48+42,22,'#173c45','center');text('Birds · Ducks · Deer',W/2,H*.48+76,15,'#396a70','center');g.fillStyle='#ef704e';g.fillRect(W/2-105,H*.48+100,210,52);text('PLAY',W/2,H*.48+134,20,'#fff','center');text('LEVELS        SHOP',W/2,H*.48+175,13,'#ef704e','center');text(`COINS  ${coins}`,W/2,H-34,16,'#fff','center')}
function levels(){bg('meadow');g.fillStyle='#173c45cc';g.fillRect(0,0,W,H);text('CHOOSE A HUNT',W/2,70,30,'#fff','center');text(`COINS ${coins}`,W/2,99,14,'#ffe17b','center');let cols=W<650?1:2;let cardW=cols===1?Math.min(410,W-42):Math.min(370,W/2-35),cardH=70;LEVELS.forEach((L,i)=>{let col=i%cols,row=Math.floor(i/cols),px=cols===1?W/2-cardW/2:25+col*(cardW+25),py=125+row*82;panel(px,py,cardW,cardH);let ok=i<unlocked;text(`${ok?'▶':'🔒'}  ${i+1}. ${L.name}`,px+18,py+28,16,ok?'#173c45':'#78908f');text(L.goal,px+18,py+51,11,'#527275')});text('BACK',24,H-28,14,'#fff')}
function shop(){bg('river');g.fillStyle='#173c45cc';g.fillRect(0,0,W,H);text('TRAIL SHOP',W/2,72,32,'#fff','center');text(`COINS ${coins}`,W/2,100,15,'#ffe17b','center');let items=[['quiver','BIGGER QUIVER','+2 arrows per level',60],['steady','STEADY GRIP','slower aim drift',80],['flame','SUN ARROWS','bright hit burst',100]];items.forEach((it,i)=>{let py=140+i*90;panel(W/2-180,py,360,72);text(it[1],W/2-155,py+27,16,'#173c45');text(it[2],W/2-155,py+50,12,'#527275');text(upgrades[it[0]]?'OWNED':`${it[3]} COINS`,W/2+115,py+40,12,upgrades[it[0]]?'#42a56f':'#ef704e','right')});text('BACK',24,H-28,14,'#fff')}
function play(){bg(LEVELS[level].bg);if(LEVELS[level].bg==='meadow'){g.fillStyle='#7b4d31';g.fillRect(W*.72,H*.39,W*.08,H*.35);g.fillStyle='#3e934d';g.beginPath();g.arc(W*.76,H*.37,150,3.2,6.2);g.fill()}targets.forEach(drawTarget);horseDraw();bow();shots.forEach(arrowDraw);particles.forEach(p=>{g.globalAlpha=Math.max(0,p.life*2);g.fillStyle=p.col;g.fillRect(p.x,p.y,5,5);g.globalAlpha=1});HUD.style.display='block';HUD.innerHTML=`<b>${LEVELS[level].name}</b><br>Targets: ${got}/${LEVELS[level].need} &nbsp; Coins: ${coins}<br>Arrows: ${arrows} &nbsp; Score: ${score}<br><small>Hit +10 coins · Miss −2 score</small>`}
function result(){bg(LEVELS[level].bg);g.fillStyle='#173c45aa';g.fillRect(0,0,W,H);panel(W/2-180,H*.2,360,360);text(got>=LEVELS[level].need?'HUNT COMPLETE':'TRY AGAIN',W/2,H*.2+58,30,got>=LEVELS[level].need?'#42a56f':'#ef704e','center');text(`${got} / ${LEVELS[level].need} targets`,W/2,H*.2+105,18,'#173c45','center');text(`SCORE  ${score}`,W/2,H*.2+145,22,'#173c45','center');text(`COINS  ${coins}`,W/2,H*.2+180,18,'#d39628','center');g.fillStyle='#ef704e';g.fillRect(W/2-115,H*.2+215,230,48);text(got>=LEVELS[level].need?'NEXT HUNT':'RETRY',W/2,H*.2+247,17,'#fff','center');text('HOME',W/2,H*.2+305,14,'#ef704e','center')}
function tapMenu(e){let q=e.touches?e.touches[0]:e,r=C.getBoundingClientRect(),px=q.clientX-r.left,py=q.clientY-r.top;if(screen==='home'){if(py>H*.45&&py<H*.72){if(px>W*.35&&px<W*.65)screen='levels';if(py>H*.58)screen='shop'}else if(py>H-80)screen='levels'}else if(screen==='levels'){if(py>H-70){screen='home';return}let cols=W<650?1:2,cardW=cols===1?Math.min(410,W-42):Math.min(370,W/2-35);for(let i=0;i<LEVELS.length;i++){let col=i%cols,row=Math.floor(i/cols),cx=cols===1?W/2-cardW/2:25+col*(cardW+25),cy=125+row*82;if(px>cx&&px<cx+cardW&&py>cy&&py<cy+70&&i<unlocked){start(i);return}}}else if(screen==='shop'){if(py>H-70){screen='home';return}let items=[['quiver',60],['steady',80],['flame',100]];items.forEach((it,i)=>{let y=140+i*90;if(py>y&&py<y+72&&coins>=it[1]&&!upgrades[it[0]]){coins-=it[1];upgrades[it[0]]=1;save();tone(850)}})}else if(screen==='result'){if(py>H*.2+190&&py<H*.2+290){if(got>=LEVELS[level].need&&level+1<LEVELS.length)start(level+1);else start(level)}else if(py>H*.2+280)screen='home'}}
function draw(){HUD.style.display=screen==='play'?'block':'none';if(screen==='home')home();else if(screen==='levels')levels();else if(screen==='shop')shop();else if(screen==='play')play();else result()}
let then=performance.now();function loop(now){let dt=Math.min(.04,(now-then)/1000);then=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
